apiVersion: v1
kind: PersistentVolume
metadata:
  name: azurefile-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany 
  persistentVolumeReclaimPolicy: Retain 
  storageClassName: azurefile-csi 
  csi:
    driver: file.csi.azure.com
    readOnly: false
    volumeHandle: unique-volumeid-1  
    volumeAttributes:
      resourceGroup: MediaHub  
      shareName: videoshare 
    nodeStageSecretRef:
      name: azure-secret  
      namespace: default 
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - uid=0
    - gid=0
    - mfsymlinks
    - cache=strict
    - nosharesock

